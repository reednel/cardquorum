name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for nx affected

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store and Jest
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            **/.jest-cache
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('jest.preset.js', '**/jest.config.cts') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx base/head for affected
        run: |
          echo "NX_BASE=origin/main" >> $GITHUB_ENV
          echo "NX_HEAD=HEAD" >> $GITHUB_ENV

      - name: Lint
        run: pnpm nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

      - name: Build
        run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD

      - name: Test
        run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD
